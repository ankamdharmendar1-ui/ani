<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting... | 9anime</title>
  <script>
    // Get the current path (e.g. /anime/one-piece/ or /one-piece-episode-1171/)
    var path = window.location.pathname;
    var query = window.location.search;
    var hash = window.location.hash;

    // Redirect to the same path on the original site
    var targetUrl = "https://9anime.org.lv" + path + query + hash;

    window.location.replace(targetUrl);
  </script>
  <style>
    body {
      margin: 0;
      background: #0f0f1a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #aaa; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Loading anime... please wait</p>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://9anime.org.lv" />
  </noscript>
</body>
</html>
